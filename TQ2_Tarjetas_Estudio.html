<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TQ2 Vocabulario - Tarjetas</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#0f1115; --card-bg:#1a1d24; --card-back:#182234; --accent:#5b8cff;
    --green:#3ecf6a; --amber:#f0a93a; --red:#e6584f; --text:#eef0f4; --muted:#9aa3b2;
    --border:#2a2e38;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    padding:10px 14px 8px; flex-shrink:0; border-bottom:1px solid var(--border);
  }
  h1{font-size:16px; margin:0 0 6px; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  .subtitle{font-size:12px; color:var(--muted);}
  .progress-wrap{margin-top:8px;}
  .progress-bar{height:6px; background:var(--border); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); width:0%; transition:width .3s;}
  .progress-label{font-size:11px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between;}
  .toolbar{display:flex; gap:6px; padding:8px 14px; flex-shrink:0; overflow-x:auto;}
  .btn-small{
    background:var(--card-bg); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:8px; font-size:12px; white-space:nowrap; cursor:pointer;
  }
  .btn-small.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  main{flex:1; display:flex; flex-direction:column; padding:10px 14px; min-height:0;}
  .card-area{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; perspective:1200px;}
  .card{
    width:100%; max-width:480px; height:100%; max-height:420px; position:relative;
    cursor:pointer; transform-style:preserve-3d; transition:transform .45s;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; border-radius:18px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; border:1px solid var(--border);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .face.front{background:var(--card-bg);}
  .face.back{background:var(--card-back); transform:rotateY(180deg); overflow-y:auto;}
  .topic-tag{
    position:absolute; top:14px; left:14px; font-size:10px; color:var(--muted);
    background:rgba(255,255,255,0.05); padding:3px 8px; border-radius:6px;
  }
  .box-tag{position:absolute; top:14px; right:14px; font-size:10px; color:var(--muted);}
  .de-term{font-size:26px; font-weight:700; line-height:1.3;}
  .hint{margin-top:14px; font-size:11px; color:var(--muted);}
  .es-term{font-size:22px; font-weight:700; color:var(--accent); line-height:1.3;}
  .en-term{font-size:15px; color:var(--muted); margin-top:8px; font-style:italic;}
  .note{font-size:13px; color:var(--text); margin-top:14px; line-height:1.5; opacity:.9; border-top:1px solid var(--border); padding-top:12px;}
  .empty-state{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6;}
  .rating-row{display:flex; gap:8px; padding:12px 0 6px; flex-shrink:0;}
  .rate-btn{
    flex:1; padding:14px 4px; border-radius:12px; border:none; font-size:13px; font-weight:600;
    color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .rate-btn small{font-weight:400; opacity:.85; font-size:10px;}
  .rate-again{background:var(--red);}
  .rate-hard{background:var(--amber);}
  .rate-good{background:var(--accent);}
  .rate-easy{background:var(--green);}
  .nav-row{display:flex; gap:8px; padding:0 0 8px; flex-shrink:0;}
  .nav-btn{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card-bg); color:var(--muted); font-size:12px; cursor:pointer;
  }
  .panel-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-end; justify-content:center; z-index:20;
  }
  .panel-overlay.open{display:flex;}
  .panel{
    background:var(--card-bg); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;
  }
  .panel h2{font-size:15px; margin:0 0 10px;}
  .topic-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 4px;
    border-bottom:1px solid var(--border); font-size:13px;
  }
  .topic-row label{display:flex; align-items:center; gap:10px; flex:1;}
  .topic-count{color:var(--muted); font-size:11px;}
  .panel-actions{display:flex; gap:8px; margin-top:14px;}
  .panel-actions button{
    flex:1; padding:10px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:13px; cursor:pointer;
  }
  .panel-actions button.secondary{background:var(--border); color:var(--text);}
  .close-panel{
    position:sticky; top:0; float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;
  }
  input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent);}
</style>
</head>
<body>

<header>
  <h1>TQ2 Vocabulario <span class="subtitle" id="modeLabel"></span></h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressText">0 / 0 dominadas</span><span id="dueText"></span></div>
  </div>
</header>

<div class="toolbar">
  <button class="btn-small" id="btnAll">Todas (<span id="cntAll"></span>)</button>
  <button class="btn-small" id="btnDue">A repasar (<span id="cntDue"></span>)</button>
  <button class="btn-small" id="btnNew">Nuevas (<span id="cntNew"></span>)</button>
  <button class="btn-small" id="btnHard">Difíciles (<span id="cntHard"></span>)</button>
  <button class="btn-small" id="btnTopics">Temas</button>
  <button class="btn-small" id="btnDir">DE→ES</button>
</div>

<main>
  <div class="card-area">
    <div class="card" id="card">
      <div class="face front">
        <div class="topic-tag" id="frontTopic"></div>
        <div class="box-tag" id="frontBox"></div>
        <div id="frontTerm" class="de-term"></div>
        <div class="hint">Toca la tarjeta para ver la respuesta</div>
      </div>
      <div class="face back">
        <div class="topic-tag" id="backTopic"></div>
        <div id="backEs" class="es-term"></div>
        <div id="backEn" class="en-term"></div>
        <div id="backNote" class="note"></div>
      </div>
    </div>
  </div>

  <div class="rating-row" id="ratingRow" style="display:none;">
    <button class="rate-btn rate-again" data-r="0">Otra vez<small>&lt;1 min</small></button>
    <button class="rate-btn rate-hard" data-r="1">Difícil<small>1 día</small></button>
    <button class="rate-btn rate-good" data-r="2">Bien<small>3 días</small></button>
    <button class="rate-btn rate-easy" data-r="3">Fácil<small>7+ días</small></button>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="btnSkip">Saltar tarjeta ▸</button>
    <button class="nav-btn" id="btnShuffle">🔀 Mezclar</button>
    <button class="nav-btn" id="btnReset">Reiniciar progreso</button>
  </div>
</main>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel">
    <button class="close-panel" id="closePanel">×</button>
    <h2>Filtrar por tema</h2>
    <div id="topicList"></div>
    <div class="panel-actions">
      <button class="secondary" id="selectAllTopics">Seleccionar todos</button>
      <button id="applyTopics">Aplicar</button>
    </div>
  </div>
</div>

    const TOPICS = ["Sala limpia", "Limpieza", "Seguridad ESD/EGB y estructura física del Reinraum", "Formación / administración", "Electrónica", "Fundamentos de semiconductores", "Fabricación de obleas", "Oxidación térmica", "Litografía", "Grabado", "Dopaje", "Deposición", "Metalización y mecanismos de falla", "CMP", "Técnicas de medición de proceso", "Backend", "Técnica de vacío", "Elementos químicos relevantes", "Práctica (HP)"];

const STORAGE_KEY = 'tq2_vocab_progress_v1';
const TOPICS_KEY = 'tq2_vocab_topics_v1';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function loadSelectedTopics(){
  try{
    const raw = localStorage.getItem(TOPICS_KEY);
    return raw ? JSON.parse(raw) : TOPICS.slice();
  }catch(e){ return TOPICS.slice(); }
}
function saveSelectedTopics(t){
  localStorage.setItem(TOPICS_KEY, JSON.stringify(t));
}

let progress = loadProgress(); // { [id]: {box, due, seen} }
let selectedTopics = loadSelectedTopics();
let direction = 'de-es'; // or 'es-de'
let mode = 'all'; // all | due | new | hard
let deck = [];
let idx = 0;
let flipped = false;

const now = () => Date.now();
const DAY = 86400000;
const BOX_INTERVALS = [0, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY]; // box 0..5

function getCardState(id){
  return progress[id] || {box:0, due:0, seen:0};
}

function cardsForTopics(){
  return CARDS.filter(c => selectedTopics.includes(c.topic));
}

function buildDeck(){
  let pool = cardsForTopics();
  if(mode === 'due'){
    pool = pool.filter(c => { const s = getCardState(c.id); return s.seen>0 && s.due <= now(); });
  } else if(mode === 'new'){
    pool = pool.filter(c => getCardState(c.id).seen === 0);
  } else if(mode === 'hard'){
    pool = pool.filter(c => { const s = getCardState(c.id); return s.seen>0 && s.box <= 1; });
  }
  deck = pool.slice();
  shuffleDeck();
  idx = 0;
}

function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
}

function updateCounts(){
  const pool = cardsForTopics();
  const total = pool.length;
  const dueCount = pool.filter(c=>{const s=getCardState(c.id); return s.seen>0 && s.due<=now();}).length;
  const newCount = pool.filter(c=>getCardState(c.id).seen===0).length;
  const hardCount = pool.filter(c=>{const s=getCardState(c.id); return s.seen>0 && s.box<=1;}).length;
  const mastered = pool.filter(c=>getCardState(c.id).box>=4).length;

  document.getElementById('cntAll').textContent = total;
  document.getElementById('cntDue').textContent = dueCount;
  document.getElementById('cntNew').textContent = newCount;
  document.getElementById('cntHard').textContent = hardCount;
  document.getElementById('progressText').textContent = mastered + ' / ' + total + ' dominadas';
  document.getElementById('dueText').textContent = dueCount>0 ? (dueCount+' a repasar') : '¡al día!';
  document.getElementById('progressFill').style.width = total>0 ? Math.round(mastered/total*100)+'%' : '0%';
}

function modeLabelText(){
  const m = {all:'Todas', due:'A repasar', new:'Nuevas', hard:'Difíciles'}[mode];
  return '· ' + m + ' · ' + (deck.length) + ' tarjetas';
}

function renderCard(){
  const card = document.getElementById('card');
  const ratingRow = document.getElementById('ratingRow');
  flipped = false;
  card.classList.remove('flipped');

  if(deck.length === 0 || idx >= deck.length){
    document.getElementById('frontTopic').textContent = '';
    document.getElementById('frontBox').textContent = '';
    document.getElementById('frontTerm').innerHTML = '<div class="empty-state">No hay tarjetas en esta selección.<br>Prueba otro filtro o marca más temas.</div>';
    document.getElementById('backEs').textContent = '';
    document.getElementById('backEn').textContent = '';
    document.getElementById('backNote').textContent = '';
    ratingRow.style.display = 'none';
    document.getElementById('modeLabel').textContent = modeLabelText();
    updateCounts();
    return;
  }

  const c = deck[idx];
  const s = getCardState(c.id);
  const frontText = direction === 'de-es' ? c.de : c.es;
  const backMain = direction === 'de-es' ? c.es : c.de;
  const backSecondary = c.en;

  document.getElementById('frontTopic').textContent = c.topic;
  document.getElementById('frontBox').textContent = s.box>=4 ? '★ dominada' : (s.seen>0 ? 'caja '+s.box : 'nueva');
  document.getElementById('frontTerm').innerHTML = '';
  document.getElementById('frontTerm').textContent = frontText;
  document.getElementById('backTopic').textContent = c.topic;
  document.getElementById('backEs').textContent = backMain;
  document.getElementById('backEn').textContent = backSecondary ? backSecondary : '';
  document.getElementById('backNote').textContent = c.note ? c.note : '';
  ratingRow.style.display = 'none';
  document.getElementById('modeLabel').textContent = modeLabelText();
  updateCounts();
}

function flipCard(){
  if(deck.length===0) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  document.getElementById('ratingRow').style.display = flipped ? 'flex' : 'none';
}

function rate(r){
  if(deck.length===0 || idx>=deck.length) return;
  const c = deck[idx];
  let s = getCardState(c.id);
  s.seen = (s.seen||0) + 1;
  if(r === 0){ s.box = 0; }
  else if(r === 1){ s.box = Math.max(0, s.box); s.box = Math.min(s.box, 1); }
  else if(r === 2){ s.box = Math.min(5, s.box + 1); }
  else if(r === 3){ s.box = Math.min(5, s.box + 2); }
  s.due = now() + (BOX_INTERVALS[Math.min(s.box, BOX_INTERVALS.length-1)] || DAY);
  progress[c.id] = s;
  saveProgress(progress);
  nextCard();
}

function nextCard(){
  idx++;
  if(idx >= deck.length){
    buildDeck();
  }
  renderCard();
}

function setMode(m){
  mode = m;
  document.querySelectorAll('#btnAll,#btnDue,#btnNew,#btnHard').forEach(b=>b.classList.remove('active'));
  ({all:'btnAll',due:'btnDue',new:'btnNew',hard:'btnHard'})[m] &&
    document.getElementById(({all:'btnAll',due:'btnDue',new:'btnNew',hard:'btnHard'})[m]).classList.add('active');
  buildDeck();
  renderCard();
}

function renderTopicPanel(){
  const list = document.getElementById('topicList');
  list.innerHTML = '';
  TOPICS.forEach(t => {
    const n = CARDS.filter(c=>c.topic===t).length;
    const row = document.createElement('div');
    row.className = 'topic-row';
    const checked = selectedTopics.includes(t) ? 'checked' : '';
    row.innerHTML = '<label><input type="checkbox" data-topic="'+t.replace(/"/g,'&quot;')+'" '+checked+'/> '+t+'</label><span class="topic-count">'+n+'</span>';
    list.appendChild(row);
  });
}

document.getElementById('card').addEventListener('click', flipCard);
document.querySelectorAll('.rate-btn').forEach(b=>{
  b.addEventListener('click', (e)=>{ e.stopPropagation(); rate(parseInt(b.dataset.r)); });
});
document.getElementById('btnSkip').addEventListener('click', nextCard);
document.getElementById('btnShuffle').addEventListener('click', ()=>{ shuffleDeck(); idx=0; renderCard(); });
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(confirm('¿Reiniciar todo tu progreso guardado? Esta acción no se puede deshacer.')){
    progress = {};
    saveProgress(progress);
    buildDeck();
    renderCard();
  }
});
document.getElementById('btnAll').addEventListener('click', ()=>setMode('all'));
document.getElementById('btnDue').addEventListener('click', ()=>setMode('due'));
document.getElementById('btnNew').addEventListener('click', ()=>setMode('new'));
document.getElementById('btnHard').addEventListener('click', ()=>setMode('hard'));
document.getElementById('btnDir').addEventListener('click', ()=>{
  direction = direction === 'de-es' ? 'es-de' : 'de-es';
  document.getElementById('btnDir').textContent = direction === 'de-es' ? 'DE→ES' : 'ES→DE';
  renderCard();
});
document.getElementById('btnTopics').addEventListener('click', ()=>{
  renderTopicPanel();
  document.getElementById('panelOverlay').classList.add('open');
});
document.getElementById('closePanel').addEventListener('click', ()=>{
  document.getElementById('panelOverlay').classList.remove('open');
});
document.getElementById('panelOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'panelOverlay') document.getElementById('panelOverlay').classList.remove('open');
});
document.getElementById('selectAllTopics').addEventListener('click', ()=>{
  document.querySelectorAll('#topicList input[type=checkbox]').forEach(cb=>cb.checked=true);
});
document.getElementById('applyTopics').addEventListener('click', ()=>{
  const checked = Array.from(document.querySelectorAll('#topicList input[type=checkbox]:checked')).map(cb=>cb.dataset.topic);
  selectedTopics = checked.length ? checked : TOPICS.slice();
  saveSelectedTopics(selectedTopics);
  document.getElementById('panelOverlay').classList.remove('open');
  buildDeck();
  renderCard();
});

// init
setMode('all');
</script>
</body>
</html>
