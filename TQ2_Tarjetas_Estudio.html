<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TQ2 Vocabulario - Tarjetas</title>
<style>
  :root{
    --bg:#0f1115; --card-bg:#1a1d24; --card-back:#182234; --accent:#5b8cff;
    --green:#3ecf6a; --amber:#f0a93a; --red:#e6584f; --text:#eef0f4; --muted:#9aa3b2;
    --border:#2a2e38;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    padding:10px 14px 8px; flex-shrink:0; border-bottom:1px solid var(--border);
  }
  h1{font-size:16px; margin:0 0 6px; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  .subtitle{font-size:12px; color:var(--muted);}
  .progress-wrap{margin-top:8px;}
  .progress-bar{height:6px; background:var(--border); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); width:0%; transition:width .3s;}
  .progress-label{font-size:11px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between;}
  .toolbar{display:flex; gap:6px; padding:8px 14px; flex-shrink:0; overflow-x:auto;}
  .btn-small{
    background:var(--card-bg); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:8px; font-size:12px; white-space:nowrap; cursor:pointer;
  }
  .btn-small.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  main{flex:1; display:flex; flex-direction:column; padding:10px 14px; min-height:0;}
  .card-area{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; perspective:1200px;}
  .card{
    width:100%; max-width:480px; height:100%; max-height:420px; position:relative;
    cursor:pointer; transform-style:preserve-3d; transition:transform .45s;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; border-radius:18px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; border:1px solid var(--border);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .face.front{background:var(--card-bg);}
  .face.back{background:var(--card-back); transform:rotateY(180deg); overflow-y:auto;}
  .topic-tag{
    position:absolute; top:14px; left:14px; font-size:10px; color:var(--muted);
    background:rgba(255,255,255,0.05); padding:3px 8px; border-radius:6px;
  }
  .box-tag{position:absolute; top:14px; right:14px; font-size:10px; color:var(--muted);}
  .de-term{font-size:26px; font-weight:700; line-height:1.3;}
  .hint{margin-top:14px; font-size:11px; color:var(--muted);}
  .es-term{font-size:22px; font-weight:700; color:var(--accent); line-height:1.3;}
  .en-term{font-size:15px; color:var(--muted); margin-top:8px; font-style:italic;}
  .note{font-size:13px; color:var(--text); margin-top:14px; line-height:1.5; opacity:.9; border-top:1px solid var(--border); padding-top:12px;}
  .empty-state{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6;}
  .rating-row{display:flex; gap:8px; padding:12px 0 6px; flex-shrink:0;}
  .rate-btn{
    flex:1; padding:14px 4px; border-radius:12px; border:none; font-size:13px; font-weight:600;
    color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .rate-btn small{font-weight:400; opacity:.85; font-size:10px;}
  .rate-again{background:var(--red);}
  .rate-hard{background:var(--amber);}
  .rate-good{background:var(--accent);}
  .rate-easy{background:var(--green);}
  .nav-row{display:flex; gap:8px; padding:0 0 8px; flex-shrink:0;}
  .nav-btn{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card-bg); color:var(--muted); font-size:12px; cursor:pointer;
  }
  .panel-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-end; justify-content:center; z-index:20;
  }
  .panel-overlay.open{display:flex;}
  .panel{
    background:var(--card-bg); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;
  }
  .panel h2{font-size:15px; margin:0 0 10px;}
  .topic-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 4px;
    border-bottom:1px solid var(--border); font-size:13px;
  }
  .topic-row label{display:flex; align-items:center; gap:10px; flex:1;}
  .topic-count{color:var(--muted); font-size:11px;}
  .panel-actions{display:flex; gap:8px; margin-top:14px;}
  .panel-actions button{
    flex:1; padding:10px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:13px; cursor:pointer;
  }
  .panel-actions button.secondary{background:var(--border); color:var(--text);}
  .close-panel{
    position:sticky; top:0; float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;
  }
  input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent);}
</style>
</head>
<body>

<header>
  <h1>TQ2 Vocabulario <span class="subtitle" id="modeLabel"></span></h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressText">0 / 0 dominadas</span><span id="dueText"></span></div>
  </div>
</header>

<div class="toolbar">
  <button class="btn-small" id="btnAll">Todas (<span id="cntAll"></span>)</button>
  <button class="btn-small" id="btnDue">A repasar (<span id="cntDue"></span>)</button>
  <button class="btn-small" id="btnNew">Nuevas (<span id="cntNew"></span>)</button>
  <button class="btn-small" id="btnHard">Difíciles (<span id="cntHard"></span>)</button>
  <button class="btn-small" id="btnTopics">Temas</button>
  <button class="btn-small" id="btnDir">DE→ES</button>
</div>

<main>
  <div class="card-area">
    <div class="card" id="card">
      <div class="face front">
        <div class="topic-tag" id="frontTopic"></div>
        <div class="box-tag" id="frontBox"></div>
        <div id="frontTerm" class="de-term"></div>
        <div class="hint">Toca la tarjeta para ver la respuesta</div>
      </div>
      <div class="face back">
        <div class="topic-tag" id="backTopic"></div>
        <div id="backEs" class="es-term"></div>
        <div id="backEn" class="en-term"></div>
        <div id="backNote" class="note"></div>
      </div>
    </div>
  </div>

  <div class="rating-row" id="ratingRow" style="display:none;">
    <button class="rate-btn rate-again" data-r="0">Otra vez<small>&lt;1 min</small></button>
    <button class="rate-btn rate-hard" data-r="1">Difícil<small>1 día</small></button>
    <button class="rate-btn rate-good" data-r="2">Bien<small>3 días</small></button>
    <button class="rate-btn rate-easy" data-r="3">Fácil<small>7+ días</small></button>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="btnSkip">Saltar tarjeta ▸</button>
    <button class="nav-btn" id="btnShuffle">🔀 Mezclar</button>
    <button class="nav-btn" id="btnReset">Reiniciar progreso</button>
  </div>
</main>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel">
    <button class="close-panel" id="closePanel">×</button>
    <h2>Filtrar por tema</h2>
    <div id="topicList"></div>
    <div class="panel-actions">
      <button class="secondary" id="selectAllTopics">Seleccionar todos</button>
      <button id="applyTopics">Aplicar</button>
    </div>
  </div>
</div>

es", "de": "der Mundschutz", "es": "mascarilla", "en": "face mask", "note": "Parte del EPP de sala limpia junto con cofia, overol y guantes.", "id": 14, "topic": "Sala limpia"}, {"section": "Sala limpia (Reinraum) — fundamentos y clases", "de": "die PSA (persönliche Schutzausrüstung)", "es": "EPP (equipo de protección personal)", "en": "PPE (personal protective equipment)", "note": "Sigla muy usada en contexto de seguridad industrial.", "id": 15, "topic": "Sala limpia"}, {"section": "Sala limpia (Reinraum) — fundamentos y clases", "de": "die Nitrilhandschuhe (pl.)", "es": "guantes de nitrilo", "en": "nitrile gloves", "note": "Evitan que la piel de las manos genere partículas.", "id": 16, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "das Partikelmessgerät, -e (CEM)", "es": "contador de partículas (modelo CEM)", "en": "particle counter (CEM model)", "note": "Partikel = partícula, Messgerät = aparato de medición.", "id": 17, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "das Handpartikelmessgerät, -e", "es": "contador de partículas manual/portátil", "en": "handheld particle counter", "note": "Hand- = manual, portátil (vs. equipo de pie fijo).", "id": 18, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "der Partikelzähler, -", "es": "contador de partículas (principio de funcionamiento)", "en": "particle counter", "note": "Bomba de vacío + láser + fotodiodo + electrónica contadora.", "id": 19, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "der Ansaugstutzen, -", "es": "boquilla/tubuladura de succión", "en": "suction nozzle/inlet", "note": "ansaugen = aspirar, succionar; Stutzen = tubo corto de conexión.", "id": 20, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "die Spülzeit, -en", "es": "tiempo de purga/enjuague (automático)", "en": "purge/rinse time", "note": "spülen = enjuagar — mismo verbo que \"fregar los platos\".", "id": 21, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "die Vergleichsmessung, -en", "es": "medición comparativa/de referencia", "en": "reference/comparison measurement", "note": "Vergleich = comparación.", "id": 22, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "die Verteilung, -en", "es": "distribución (estadística)", "en": "distribution", "note": "No confundir con Verteidigung (defensa) — casi idénticas al oído.", "id": 23, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "die Messzelle, -n", "es": "celda/zona de medición", "en": "measuring cell", "note": "Zona por donde pasa el haz láser dentro del contador de partículas.", "id": 24, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "das Streulicht", "es": "luz dispersada/dispersión de luz", "en": "scattered light", "note": "streuen = dispersar; a mayor partícula, mayor dispersión, menos luz al fotodiodo.", "id": 25, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "die Fotodiode, -n", "es": "fotodiodo", "en": "photodiode", "note": "Recibe el pulso de luz dispersada; a mayor partícula, mayor pulso.", "id": 26, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "die Sichtkontrolle, -n", "es": "control/inspección visual", "en": "visual inspection", "note": "Primer paso (macroscópico) del análisis de un wafer, antes del microscopio.", "id": 27, "topic": "Sala limpia"}, {"section": "Sala limpia — medición de partículas y microscopía", "de": "der Fettfinger, -", "es": "marca de dedo grasosa (huella)", "en": "greasy fingerprint", "note": "Fett = grasa; señal típica de mal uso de guantes.", "id": 28, "topic": "Sala limpia"}, {"secti lue/dicing tape", "note": "Se estira para separar los chips tras el serrado.", "id": 551, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "das Wire Bonding (Drahtbonden)", "es": "conexión por hilo (wire bonding)", "en": "wire bonding", "note": "Reibschweißverfahren (soldadura por fricción).", "id": 552, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "das Ultraschallbonden (US)", "es": "bonding por ultrasonidos", "en": "ultrasonic (US) bonding", "note": "Cabezal plano, sin fundir el hilo, dirección única.", "id": 553, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "das Thermosonic-Bonden", "es": "bonding termosónico", "en": "thermosonic bonding", "note": "Bola de oro fundida + presión, libertad direccional 360°.", "id": 554, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "der Pull-Test", "es": "ensayo de tracción", "en": "pull test", "note": "Ideal: rotura en el centro del lazo, no en el pad.", "id": 555, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "der Shear-Test", "es": "ensayo de cizalladura", "en": "shear test", "note": "Evalúa adherencia del pad/bondstelle.", "id": 556, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "das C4-Verfahren (Flipchip)", "es": "proceso C4 / flip-chip", "en": "C4 (Controlled Collapse Chip Connection)", "note": "Todos los contactos en una cara, bolitas de soldadura.", "id": 557, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "der Underfill", "es": "adhesivo de relleno (underfill)", "en": "underfill", "note": "Estabiliza mecánicamente el flip-chip.", "id": 558, "topic": "Backend"}, {"section": "Backend (ensamblaje y empaquetado)", "de": "das Substrat, -e", "es": "sustrato (mini placa intermedia)", "en": "substrate (interposer-like)", "note": "Agrupa contactos antes de la placa final.", "id": 559, "topic": "Backend"}, {"section": "B ecksilberbarometer", "es": "barómetro de mercurio", "en": "mercury barometer", "note": "Inventado por Torricelli.", "id": 569, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "das Grobvakuum / Feinvakuum / Hochvakuum (HV) / Ultrahochvakuum (UHV)", "es": "vacío grueso / fino / alto / ultra alto", "en": "rough / medium-fine / high / ultra-high vacuum", "note": "Grob hasta 1 mbar; Fein hasta 10⁻³; HV hasta 10⁻⁷; UHV por debajo.", "id": 570, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Teilchenanzahldichte", "es": "densidad de partículas (numérica)", "en": "particle number density", "note": "Moléculas de gas por unidad de volumen a una presión dada.", "id": 571, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die mittlere freie Weglänge", "es": "camino libre medio", "en": "mean free path", "note": "Distancia recorrida por una molécula antes de chocar con otra.", "id": 572, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Kontinuumströmung / Knudsenströmung / molekulare Strömung", "es": "flujo continuo / de Knudsen / molecular", "en": "continuum / Knudsen / molecular flow", "note": "Continuum: vacío grueso. Knudsen: transición. Molecular: alto vacío.", "id": 573, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Vakuumpumpe, -n", "es": "bomba de vacío", "en": "vacuum pump", "note": "—", "id": 574, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Gastransferpumpe", "es": "bomba de transferencia de gas", "en": "gas transfer pump", "note": "Expulsa el gas hacia afuera.", "id": 575, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die gasbindende Vakuumpumpe", "es": "bomba de vacío que retiene el gas", "en": "gas-binding / capture pump", "note": "El gas queda atrapado dentro de la bomba.", "id": 576, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Verdrängervakuumpumpe", "es": "bomba de desplazamiento", "en": "positive displacement pump", "note": "Crea un espacio que se agranda y luego se comprime.", "id": 577, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die kinetische Vakuumpumpe", "es": "bomba cinética", "en": "kinetic pump", "note": "Acelera las moléculas con alta energía.", "id": 578, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Vorvakuumpumpe / Hochvakuumpumpe", "es": "bomba de prevacío/respaldo / bomba de alto vacío", "en": "backing/roughing pump / high vacuum pump", "note": "La de prevacío siempre es necesaria antes de la de alto vacío.", "id": 579, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Hubkolbenpumpe", "es": "bomba de pistón alternativo", "en": "piston pump / reciprocating pump", "note": "Ejemplo más simple del principio de desplazamiento.", "id": 580, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Drehschieberpumpe", "es": "bomba rotativa de paletas", "en": "rotary vane pump", "note": "Usada como bomba de prevacío; trabaja con aceite.", "id": 581, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "das Gasballastventil", "es": "válvula de lastre de gas", "en": "gas ballast valve", "note": "Evita que la humedad se condense y se mezcle con el aceite.", "id": 582, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "der Ölabscheider", "es": "separador de aceite", "en": "oil mist separator", "note": "Retira restos de aceite del aire de escape.", "id": 583, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Wälzkolbenpumpe", "es": "bomba de lóbulos (Roots)", "en": "Roots pump / lobe pump", "note": "Dos rotores en forma de \"8\" que giran en direcciones opuestas.", "id": 584, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Kreiskolbenpumpe", "es": "bomba de pistón rotativo (tipo Wankel)", "en": "rotary piston pump", "note": "Comparada con el motor Wankel.", "id": 585, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Turbomolekularpumpe", "es": "bomba turbomolecular", "en": "turbomolecular pump", "note": "Rotor de aspas a 60.000–100.000 rpm; nunca arrancar desde presión atmosférica.", "id": 586, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "das Magnetlager", "es": "cojinete magnético", "en": "magnetic bearing", "note": "Sin contacto físico → desgaste mínimo.", "id": 587, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Schleuse, -n (Vakuum)", "es": "esclusa de vacío", "en": "load lock", "note": "Permite mover obleas sin romper el vacío principal.", "id": 588, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "der Pufferraum / Puffer", "es": "precámara / buffer", "en": "buffer chamber / pre-chamber", "note": "También llamado \"Pre-Chamber\".", "id": 589, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Ionenzerstäuberpumpe (Ionen-Getter-Pumpe)", "es": "bomba iónica de pulverización (getter)", "en": "ion getter pump / sputter-ion pump", "note": "Usa titanio como material de sacrificio; casi sin desgaste.", "id": 590, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Kryopumpe", "es": "criobomba", "en": "cryopump", "note": "Trabaja por debajo de -270 °C, con circuito de helio.", "id": 591, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Leckrate", "es": "tasa de fuga", "en": "leak rate", "note": "Se calcula como ΔP × V / Δt.", "id": 592, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Druckanstiegsmessung", "es": "medición de subida de presión", "en": "pressure rise test", "note": "Método estándar de control de estanqueidad.", "id": 593, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "der Bilanzraum, -räume [A CONFIRMAR]", "es": "tramo / espacio de balance del sistema", "en": "test volume / segment", "note": "Sección delimitada por válvulas para medir su propia tasa de fuga.", "id": 594, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "der Helium-Lecktester", "es": "detector de fugas por helio", "en": "helium leak detector", "note": "Método estándar en la industria de semiconductores.", "id": 595, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Sprühpistole", "es": "pistola pulverizadora", "en": "spray gun", "note": "Para aplicar helio de forma puntual.", "id": 596, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Schnüffelsonde", "es": "sonda rastreadora (de fugas)", "en": "sniffer probe", "note": "Alternativa: inundar con helio y rastrear con sonda.", "id": 597, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Abpumpkurve", "es": "curva de vaciado", "en": "pump-down curve", "note": "Presión vs. tiempo, en papel logarítmico.", "id": 598, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "das Membranvakuummeter / kapazitive Membranvakuummeter", "es": "manómetro de membrana (mecánico / capacitivo)", "en": "diaphragm gauge / capacitance manometer", "note": "Mecánico: hasta ≈1 mbar. Capacitivo: hasta ≈10⁻⁵ mbar, independiente del gas.", "id": 599, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "das Wärmeleitvakuummeter (Pirani)", "es": "manómetro de conductividad térmica (Pirani)", "en": "thermal conductivity (Pirani) gauge", "note": "Depende del gas; usa un puente de Wheatstone.", "id": 600, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "das Glühkathoden-/Kaltkathoden-Ionisationsvakuummeter", "es": "manómetro de ionización de cátodo caliente / frío", "en": "hot/cold cathode ionization gauge", "note": "Ambos dependen del gas; el de cátodo caliente es el más preciso en vacío profundo.", "id": 601, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "gasartabhängig / gasartunabhängig", "es": "dependiente / independiente del tipo de gas", "en": "gas-species dependent / independent", "note": "—", "id": 602, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "ausheizen", "es": "desgasificar por calentamiento (hornear la cámara)", "en": "bakeout", "note": "Libera moléculas adheridas a las superficies.", "id": 603, "topic": "Técnica de vacío"}, {"section": "Técnica de vacío (Vakuumtechnik)", "de": "die Wheatstonesche Brücke", "es": "puente de Wheatstone", "en": "Wheatstone bridge", "note": "Circuito usado en el Pirani para medir cambios de resistencia.", "id": 604, "topic": "Técnica de vacío"}];
const TOPICS = ["Sala limpia", "Limpieza", "Seguridad ESD/EGB y estructura física del Reinraum", "Formación / administración", "Electrónica", "Fundamentos de semiconductores", "Fabricación de obleas", "Oxidación térmica", "Litografía", "Grabado", "Dopaje", "Deposición", "Metalización y mecanismos de falla", "CMP", "Técnicas de medición de proceso", "Backend", "Técnica de vacío"];

const STORAGE_KEY = 'tq2_vocab_progress_v1';
const TOPICS_KEY = 'tq2_vocab_topics_v1';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function loadSelectedTopics(){
  try{
    const raw = localStorage.getItem(TOPICS_KEY);
    return raw ? JSON.parse(raw) : TOPICS.slice();
  }catch(e){ return TOPICS.slice(); }
}
function saveSelectedTopics(t){
  localStorage.setItem(TOPICS_KEY, JSON.stringify(t));
}

let progress = loadProgress(); // { [id]: {box, due, seen} }
let selectedTopics = loadSelectedTopics();
let direction = 'de-es'; // or 'es-de'
let mode = 'all'; // all | due | new | hard
let deck = [];
let idx = 0;
let flipped = false;

const now = () => Date.now();
const DAY = 86400000;
const BOX_INTERVALS = [0, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY]; // box 0..5

function getCardState(id){
  return progress[id] || {box:0, due:0, seen:0};
}

function cardsForTopics(){
  return CARDS.filter(c => selectedTopics.includes(c.topic));
}

function buildDeck(){
  let pool = cardsForTopics();
  if(mode === 'due'){
    pool = pool.filter(c => { const s = getCardState(c.id); return s.seen>0 && s.due <= now(); });
  } else if(mode === 'new'){
    pool = pool.filter(c => getCardState(c.id).seen === 0);
  } else if(mode === 'hard'){
    pool = pool.filter(c => { const s = getCardState(c.id); return s.seen>0 && s.box <= 1; });
  }
  deck = pool.slice();
  shuffleDeck();
  idx = 0;
}

function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
}

function updateCounts(){
  const pool = cardsForTopics();
  const total = pool.length;
  const dueCount = pool.filter(c=>{const s=getCardState(c.id); return s.seen>0 && s.due<=now();}).length;
  const newCount = pool.filter(c=>getCardState(c.id).seen===0).length;
  const hardCount = pool.filter(c=>{const s=getCardState(c.id); return s.seen>0 && s.box<=1;}).length;
  const mastered = pool.filter(c=>getCardState(c.id).box>=4).length;

  document.getElementById('cntAll').textContent = total;
  document.getElementById('cntDue').textContent = dueCount;
  document.getElementById('cntNew').textContent = newCount;
  document.getElementById('cntHard').textContent = hardCount;
  document.getElementById('progressText').textContent = mastered + ' / ' + total + ' dominadas';
  document.getElementById('dueText').textContent = dueCount>0 ? (dueCount+' a repasar') : '¡al día!';
  document.getElementById('progressFill').style.width = total>0 ? Math.round(mastered/total*100)+'%' : '0%';
}

function modeLabelText(){
  const m = {all:'Todas', due:'A repasar', new:'Nuevas', hard:'Difíciles'}[mode];
  return '· ' + m + ' · ' + (deck.length) + ' tarjetas';
}

function renderCard(){
  const card = document.getElementById('card');
  const ratingRow = document.getElementById('ratingRow');
  flipped = false;
  card.classList.remove('flipped');

  if(deck.length === 0 || idx >= deck.length){
    document.getElementById('frontTopic').textContent = '';
    document.getElementById('frontBox').textContent = '';
    document.getElementById('frontTerm').innerHTML = '<div class="empty-state">No hay tarjetas en esta selección.<br>Prueba otro filtro o marca más temas.</div>';
    document.getElementById('backEs').textContent = '';
    document.getElementById('backEn').textContent = '';
    document.getElementById('backNote').textContent = '';
    ratingRow.style.display = 'none';
    document.getElementById('modeLabel').textContent = modeLabelText();
    updateCounts();
    return;
  }

  const c = deck[idx];
  const s = getCardState(c.id);
  const frontText = direction === 'de-es' ? c.de : c.es;
  const backMain = direction === 'de-es' ? c.es : c.de;
  const backSecondary = c.en;

  document.getElementById('frontTopic').textContent = c.topic;
  document.getElementById('frontBox').textContent = s.box>=4 ? '★ dominada' : (s.seen>0 ? 'caja '+s.box : 'nueva');
  document.getElementById('frontTerm').innerHTML = '';
  document.getElementById('frontTerm').textContent = frontText;
  document.getElementById('backTopic').textContent = c.topic;
  document.getElementById('backEs').textContent = backMain;
  document.getElementById('backEn').textContent = backSecondary ? backSecondary : '';
  document.getElementById('backNote').textContent = c.note ? c.note : '';
  ratingRow.style.display = 'none';
  document.getElementById('modeLabel').textContent = modeLabelText();
  updateCounts();
}

function flipCard(){
  if(deck.length===0) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  document.getElementById('ratingRow').style.display = flipped ? 'flex' : 'none';
}

function rate(r){
  if(deck.length===0 || idx>=deck.length) return;
  const c = deck[idx];
  let s = getCardState(c.id);
  s.seen = (s.seen||0) + 1;
  if(r === 0){ s.box = 0; }
  else if(r === 1){ s.box = Math.max(0, s.box); s.box = Math.min(s.box, 1); }
  else if(r === 2){ s.box = Math.min(5, s.box + 1); }
  else if(r === 3){ s.box = Math.min(5, s.box + 2); }
  s.due = now() + (BOX_INTERVALS[Math.min(s.box, BOX_INTERVALS.length-1)] || DAY);
  progress[c.id] = s;
  saveProgress(progress);
  nextCard();
}

function nextCard(){
  idx++;
  if(idx >= deck.length){
    buildDeck();
  }
  renderCard();
}

function setMode(m){
  mode = m;
  document.querySelectorAll('#btnAll,#btnDue,#btnNew,#btnHard').forEach(b=>b.classList.remove('active'));
  ({all:'btnAll',due:'btnDue',new:'btnNew',hard:'btnHard'})[m] &&
    document.getElementById(({all:'btnAll',due:'btnDue',new:'btnNew',hard:'btnHard'})[m]).classList.add('active');
  buildDeck();
  renderCard();
}

function renderTopicPanel(){
  const list = document.getElementById('topicList');
  list.innerHTML = '';
  TOPICS.forEach(t => {
    const n = CARDS.filter(c=>c.topic===t).length;
    const row = document.createElement('div');
    row.className = 'topic-row';
    const checked = selectedTopics.includes(t) ? 'checked' : '';
    row.innerHTML = '<label><input type="checkbox" data-topic="'+t.replace(/"/g,'&quot;')+'" '+checked+'/> '+t+'</label><span class="topic-count">'+n+'</span>';
    list.appendChild(row);
  });
}

document.getElementById('card').addEventListener('click', flipCard);
document.querySelectorAll('.rate-btn').forEach(b=>{
  b.addEventListener('click', (e)=>{ e.stopPropagation(); rate(parseInt(b.dataset.r)); });
});
document.getElementById('btnSkip').addEventListener('click', nextCard);
document.getElementById('btnShuffle').addEventListener('click', ()=>{ shuffleDeck(); idx=0; renderCard(); });
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(confirm('¿Reiniciar todo tu progreso guardado? Esta acción no se puede deshacer.')){
    progress = {};
    saveProgress(progress);
    buildDeck();
    renderCard();
  }
});
document.getElementById('btnAll').addEventListener('click', ()=>setMode('all'));
document.getElementById('btnDue').addEventListener('click', ()=>setMode('due'));
document.getElementById('btnNew').addEventListener('click', ()=>setMode('new'));
document.getElementById('btnHard').addEventListener('click', ()=>setMode('hard'));
document.getElementById('btnDir').addEventListener('click', ()=>{
  direction = direction === 'de-es' ? 'es-de' : 'de-es';
  document.getElementById('btnDir').textContent = direction === 'de-es' ? 'DE→ES' : 'ES→DE';
  renderCard();
});
document.getElementById('btnTopics').addEventListener('click', ()=>{
  renderTopicPanel();
  document.getElementById('panelOverlay').classList.add('open');
});
document.getElementById('closePanel').addEventListener('click', ()=>{
  document.getElementById('panelOverlay').classList.remove('open');
});
document.getElementById('panelOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'panelOverlay') document.getElementById('panelOverlay').classList.remove('open');
});
document.getElementById('selectAllTopics').addEventListener('click', ()=>{
  document.querySelectorAll('#topicList input[type=checkbox]').forEach(cb=>cb.checked=true);
});
document.getElementById('applyTopics').addEventListener('click', ()=>{
  const checked = Array.from(document.querySelectorAll('#topicList input[type=checkbox]:checked')).map(cb=>cb.dataset.topic);
  selectedTopics = checked.length ? checked : TOPICS.slice();
  saveSelectedTopics(selectedTopics);
  document.getElementById('panelOverlay').classList.remove('open');
  buildDeck();
  renderCard();
});

// init
setMode('all');
</script>
</body>
